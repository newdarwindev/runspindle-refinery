# Planned contents: Python and Rust interface, feedback provenance and conflict checks; not implemented.
# Current scope: scaffold structure only, not the planned product checks.
name: refinery-ci
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scaffold-structure:
    runs-on: [self-hosted, linux, x64, runspindle-isolated, strix]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate scaffold only
        run: python3 tools/check_scaffold.py
